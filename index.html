<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="language" content="Russian">
    <script>
      // Vite собирает относительные URL, а этот base направляет всю статику
      // либо в /play/, либо в корень — в том числе на вложенных маршрутах.
      (() => {
        const basePath = /^\/play(?:\/|$)/.test(window.location.pathname) ? '/play/' : '/';
        const baseElement = document.createElement('base');
        baseElement.href = basePath;
        document.head.appendChild(baseElement);
      })();
    </script>
